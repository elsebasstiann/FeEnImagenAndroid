
name: Crear APK de Fe en Imagen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar herramientas de compilación
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir -p source
          unzip -o FeEnImagenAndroid_proyecto.zip -d source

      - name: Corregir configuración de Gradle
        shell: bash
        run: |
          set -e
          echo "Buscando archivos Gradle..."
          find source -name "build.gradle" -o -name "gradle.properties"

          PROJECT_DIR="source/FeEnImagenAndroid"

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "No se encontró $PROJECT_DIR/build.gradle"
            echo "Contenido de source:"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/FeEnImagenAndroid/build.gradle")
          s = p.read_text()
          s = s.replace(r"\n", "\n")
          p.write_text(s)
          print("Archivo build.gradle revisado")
          PY

          touch "$PROJECT_DIR/gradle.properties"

          if grep -q '^org.gradle.jvmargs=' "$PROJECT_DIR/gradle.properties"; then
            sed -i '/^org.gradle.jvmargs=/c\org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' "$PROJECT_DIR/gradle.properties"
          else
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> "$PROJECT_DIR/gradle.properties"
          fi

          if ! grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties"; then
            echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          fi

      - name: Compilar APK
        run: |
          cd source/FeEnImagenAndroid
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FeEnImagen-APK
          path: source/FeEnImagenAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

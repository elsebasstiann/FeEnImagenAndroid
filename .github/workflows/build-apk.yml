
name: Crear APK de Fe en Imagen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar herramientas de compilación
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: unzip FeEnImagenAndroid_proyecto.zip -d source

      - name: Compilar APK
        run: |
          cd source/FeEnImagenAndroid
          if [ -f gradle.properties ]; then
            sed -i '/^org.gradle.jvmargs=.*android.useAndroidX=true/c\org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' gradle.properties
            grep -q '^android.useAndroidX=' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          fi
          gradle assembleDebug
          
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FeEnImagen-APK
          path: source/FeEnImagenAndroid/app/build/outputs/apk/debug/app-debug.apk
